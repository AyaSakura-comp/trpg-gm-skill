[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trpg-gm-skill"
version = "0.15.0"
description = "Persistent, room-scoped TRPG game-master skill and SQLite CLI"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TRPG GM Skill contributors"}]

[project.scripts]
trpg-gm = "trpg_gm.cli:main"

